[theme]
# Dark theme, built around the same brand colors sampled from
# assets/logo.png (teal leaf, orange dumbbell) — see ui/app.py's
# _inyectar_estilos() for the matching custom-CSS layer.
base = "dark"
primaryColor = "#05A081"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#141F33"
textColor = "#E5E7EB"
font = "sans serif"

[server]
headless = true
