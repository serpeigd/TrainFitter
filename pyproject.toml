[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
# Core correctness checks (pyflakes, pycodestyle, import sorting). Deliberately
# not turning on stricter/opinionated rule sets (naming conventions, docstring
# rules, etc.) — this project keeps Python identifiers in Spanish on purpose
# (see docs/decisiones.md), and a linter shouldn't fight a documented decision.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# One exercise/food per line, deliberately dense/tabular — wrapping would
# hurt readability more than a few over-length lines do. food_bank.py
# joined this list once bilingual "nombre_es" values were added alongside
# each entry (see docs/decisiones.md).
"agents/exercise_bank.py" = ["E501"]
"agents/food_bank.py" = ["E501"]

[tool.coverage.run]
# Scoped to the actual business logic (agents/, mcp/) -- ui/app.py is
# deliberately not unit-tested (see CLAUDE.md: it's verified live via the
# preview browser instead, a different kind of check pytest-cov can't see),
# and main.py is a thin CLI entry point exercised by the real cron job, not
# by this test suite. Counting either against "coverage" would just make
# the number meaningless, not more honest.
source = ["agents", "mcp"]
omit = [
    # Manual/demo entry points -- exercised by actually running them (see
    # CI's own "Run the full pipeline" step and each script's own
    # docstring), not by importing them under pytest. Including them here
    # would count real, working code as "uncovered" just because pytest
    # never imports a __main__-guarded script.
    "agents/run_pipeline_demo.py",
    "agents/run_routine_demo.py",
    "agents/run_manual_pipeline_demo.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
