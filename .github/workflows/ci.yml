name: CI

# El pipeline por defecto (motor="reglas") es Python estándar y no necesita
# ninguna API key, así que este workflow puede ejecutar los agentes de
# verdad -- no solo un placeholder -- en cada push/PR, gratis.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar sintaxis de todos los módulos
        run: python -m py_compile agents/*.py ui/app.py

      - name: Validar esquema de los clientes de ejemplo
        run: |
          python -c "
          import json
          for n in (1, 2):
              json.load(open(f'examples/cliente_ejemplo_{n}.json', encoding='utf-8'))
          print('JSON válido: ambos clientes de ejemplo')
          "

      - name: Ejecutar el pipeline completo (motor de reglas, sin API key)
        working-directory: agents
        run: python run_pipeline_demo.py
