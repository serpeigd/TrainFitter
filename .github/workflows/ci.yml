name: CI

# The default engine (motor="reglas") is standard Python and needs no API
# key, so this workflow can run the real agents and test suite -- not just
# a placeholder -- on every push/PR, for free.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax of all modules
        run: python -m py_compile agents/*.py ui/app.py

      - name: Lint (ruff)
        run: pip install ruff && ruff check .

      - name: Validate example client schemas
        run: |
          python -c "
          import json
          for n in (1, 2):
              json.load(open(f'examples/cliente_ejemplo_{n}.json', encoding='utf-8'))
          print('Valid JSON: both example clients')
          "

      - name: Run the full pipeline (rule engine, no API key)
        working-directory: agents
        run: python run_pipeline_demo.py

      - name: Install test dependencies
        run: pip install pytest pdfplumber

      - name: Run the test suite
        run: python -m pytest tests/ -v
