name: CI

# The default engine (motor="reglas") is standard Python and needs no API
# key, so this workflow can run the real agents and test suite -- not just
# a placeholder -- on every push/PR, for free.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # One install for everything below: lint (ruff) and the test suite's
      # mocked network tests (google-api-python-client, notion-client) and
      # PDF round-trip tests (reportlab, pypdf) all need real packages
      # installed now, not just the free rule engine's stdlib-only path --
      # requirements.txt already lists every one of them, so installing it
      # once here instead of hand-picking a subset can't drift out of sync
      # with what the suite actually imports again.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax of all modules
        run: python -m py_compile agents/*.py mcp/*.py ui/app.py main.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate example client schemas
        run: |
          python -c "
          import json
          for n in (1, 2, 3):
              json.load(open(f'examples/cliente_ejemplo_{n}.json', encoding='utf-8'))
          print('Valid JSON: all example clients')
          "

      - name: Run the full pipeline (rule engine, no API key)
        working-directory: agents
        run: python run_pipeline_demo.py

      # --cov-fail-under is a real, measured floor (currently ~97%; see
      # pyproject.toml's [tool.coverage.run] for what's in/out of scope --
      # ui/app.py and main.py are deliberately excluded, see that file's
      # own comment for why), not an arbitrary number: it fails the build
      # on a real regression while leaving headroom for new code that
      # hasn't been fully covered yet. motor="llm"'s request/response/
      # error-handling code counts too, tested against a fake `anthropic`
      # module (tests/conftest.py's fake_anthropic) -- no API key, no
      # network, no cost.
      - name: Run the test suite (with coverage)
        run: python -m pytest tests/ -v --cov --cov-report=term-missing --cov-fail-under=90
